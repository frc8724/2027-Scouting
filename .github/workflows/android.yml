name: Compile for Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10.12'
        cache: 'pip'

    - name: "Install dependencies"
      run: |
        sudo apt-get update || true
        sudo apt-get install zip build-essential ccache git libffi-dev libssl-dev libtool patch unzip zlib1g-dev autoconf automake cmake pkg-config libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-mixer-dev libgstreamer1.0-dev libgstreamer1.0-plugins-base libncurses5-dev libncursesw5-dev libtinfo5 -y || true

    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Buildozer and Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Install Pip dependencies
      run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install cython==0.29.34
          pip install pygame kivy buildozer

    - name: File cleanup/free space so Buildozer gets enough room to work
      run: |
        mv phonePortrait.py main.py
        rm -f desktop.py ipad.py
        sudo rm -rf /usr/local/.ghcup
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo rm -rf /usr/local/lib/android/sdk/ndk
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo apt-get clean

    - name: Build APK
      run: |
        yes | buildozer android debug
  
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: FRC-8724-Scout-APK-Debug
        path: bin/*.apk
